[project]
name = "cs2-prediction-machine"
version = "0.2.0"
description = "A prediction machine for CS2"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "cs2api",
    "jupyterlab",
]

[dependency-groups]
dev = [
    "taskipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.taskipy.tasks]
lint-apply = "ruff check --fix . && ruff format ."
run-server = "uvicorn app.main:app --reload"
